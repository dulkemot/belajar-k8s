# Latihan 2: Ingress - expose Service web ke LAN via Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: belajar
spec:
  ingressClassName: traefik
  rules:
    - host: web.192.168.0.100.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
