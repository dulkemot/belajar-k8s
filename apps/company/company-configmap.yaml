apiVersion: v1
data:
  index.html: "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>NusaTech
    — Solusi Digital untuk Bisnis Anda</title>\n<meta name=\"description\" content=\"NusaTech:
    jasa pembuatan website, aplikasi, dan infrastruktur cloud di Indonesia.\">\n<style>\n:root{--bg:#0b1220;--bg2:#111a2e;--card:#16213a;--line:#24314f;--txt:#e8eef7;--mut:#9fb0c9;--acc:#38bdf8;--acc2:#818cf8;--ok:#34d399}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{font-family:'Segoe
    UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}\na{color:inherit;text-decoration:none}\n.wrap{max-width:1120px;margin:0
    auto;padding:0 20px}\n/* NAV */\nnav{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.9);backdrop-filter:blur(10px);border-bottom:1px
    solid var(--line)}\n.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}\n.logo{font-size:1.3rem;font-weight:800}.logo
    span{color:var(--acc)}\n.links{display:flex;gap:22px;align-items:center}\n.links
    a{color:var(--mut);font-size:.95rem}.links a:hover{color:var(--txt)}\n.btn{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f!important;font-weight:700;padding:10px
    22px;border-radius:10px;border:0;cursor:pointer;font-size:.95rem}\n.btn:hover{filter:brightness(1.1)}\n.burger{display:none;background:none;border:0;color:var(--txt);font-size:1.6rem;cursor:pointer}\n/*
    HERO */\n.hero{padding:90px 0 70px;background:radial-gradient(800px 400px at 70%
    -50px,rgba(56,189,248,.18),transparent),radial-gradient(600px 300px at 10% 100px,rgba(129,140,248,.15),transparent)}\n.hero
    h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;margin-bottom:16px}\n.hero
    h1 span{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}\n.hero
    p{color:var(--mut);max-width:600px;margin-bottom:28px;font-size:1.05rem}\n.hero-cta{display:flex;gap:12px;flex-wrap:wrap}\n.ghost{border:1px
    solid var(--line);padding:10px 22px;border-radius:10px;color:var(--txt)!important}\n/*
    STATS */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:50px
    0}\n.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}\n.stat
    b{font-size:1.9rem;color:var(--acc);display:block}\n.stat small{color:var(--mut)}\n/*
    SECTION */\nsection{padding:64px 0}\nh2.sec{text-align:center;font-size:1.9rem;margin-bottom:8px}\np.sub{text-align:center;color:var(--mut);margin-bottom:36px}\n/*
    SERVICES */\n.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.card{background:var(--card);border:1px
    solid var(--line);border-radius:14px;padding:28px;transition:transform .2s,border-color
    .2s}\n.card:hover{transform:translateY(-4px);border-color:var(--acc)}\n.card .ico{font-size:2rem;margin-bottom:12px}\n.card
    h3{margin-bottom:8px}.card p{color:var(--mut);font-size:.93rem}\n.card .price{color:var(--ok);font-weight:700;margin-top:12px;display:block}\n/*
    PORTFOLIO */\n.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}\n.pf{border-radius:14px;overflow:hidden;border:1px
    solid var(--line);background:var(--card)}\n.pf .thumb{height:170px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;color:rgba(255,255,255,.85)}\n.pf
    .body{padding:18px 20px}.pf .body small{color:var(--acc);font-weight:700;text-transform:uppercase;font-size:.75rem;letter-spacing:1px}\n/*
    TESTI */\n.testi{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.t{background:var(--bg2);border:1px
    solid var(--line);border-radius:14px;padding:22px;font-size:.93rem}\n.t p{color:var(--mut);margin-bottom:14px}.t
    b{display:block}.t small{color:var(--acc)}\n.stars{color:#fbbf24;margin-bottom:10px;letter-spacing:2px}\n/*
    CONTACT */\n.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}\nform{background:var(--card);border:1px
    solid var(--line);border-radius:14px;padding:26px}\nlabel{display:block;font-size:.85rem;color:var(--mut);margin:12px
    0 4px}\ninput,textarea,select{width:100%;background:var(--bg);border:1px solid
    var(--line);border-radius:8px;color:var(--txt);padding:10px 12px;font-size:.95rem;font-family:inherit}\ninput:focus,textarea:focus,select:focus{outline:1px
    solid var(--acc)}\n.info div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px
    18px;margin-bottom:12px}\n.wa{position:fixed;right:20px;bottom:20px;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0
    6px 20px rgba(0,0,0,.4);z-index:60}\n/* FOOTER */\nfooter{border-top:1px solid
    var(--line);padding:28px 0;color:var(--mut);font-size:.9rem;text-align:center}\n/*
    REVEAL */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform
    .6s}\n.rv.on{opacity:1;transform:none}\n/* RESPONSIVE */\n@media(max-width:860px){.grid3,.testi{grid-template-columns:1fr
    1fr}.contact,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:640px){.links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg2);flex-direction:column;padding:16px;gap:14px;border-bottom:1px
    solid var(--line)}.links.open{display:flex}.burger{display:block}.grid3,.testi{grid-template-columns:1fr}}\n</style>\n</head>\n<body>\n<nav><div
    class=\"wrap nav-in\">\n<div class=\"logo\">Nusa<span>Tech</span></div>\n<button
    class=\"burger\" onclick=\"document.querySelector('.links').classList.toggle('open')\">☰</button>\n<div
    class=\"links\"><a href=\"#layanan\">Layanan</a><a href=\"#portfolio\">Portfolio</a><a
    href=\"#testimoni\">Testimoni</a><a href=\"#kontak\">Kontak</a><a class=\"btn\"
    href=\"#kontak\">Minta Penawaran</a></div>\n</div></nav>\n\n<header class=\"hero\"><div
    class=\"wrap\">\n<h1>Bangun Kehadiran Digital <span>Bisnis Anda</span> Bersama
    NusaTech</h1>\n<p>Kami membuat website company profile, toko online, dan aplikasi
    kustom yang cepat, aman, dan mudah dikelola — dipercaya 120+ UMKM dan perusahaan
    di Indonesia sejak 2019.</p>\n<div class=\"hero-cta\"><a class=\"btn\" href=\"#kontak\">Konsultasi
    Gratis</a><a class=\"ghost\" href=\"#portfolio\">Lihat Hasil Kerja</a></div>\n<div
    class=\"stats\">\n<div class=\"stat rv\"><b data-n=\"120\">0</b><small>Klien Puas</small></div>\n<div
    class=\"stat rv\"><b data-n=\"185\">0</b><small>Proyek Selesai</small></div>\n<div
    class=\"stat rv\"><b data-n=\"7\">0</b><small>Tahun Pengalaman</small></div>\n<div
    class=\"stat rv\"><b data-n=\"99\">0</b><small>% Tepat Waktu</small></div>\n</div>\n</div></header>\n\n<section
    id=\"layanan\"><div class=\"wrap\">\n<h2 class=\"sec\">Layanan Kami</h2><p class=\"sub\">Paket
    lengkap dari domain sampai maintenance</p>\n<div class=\"grid3\">\n<div class=\"card
    rv\"><div class=\"ico\">\U0001F310</div><h3>Company Profile</h3><p>Website profil
    perusahaan modern, SEO-friendly, dilengkapi halaman layanan, galeri, dan formulir
    kontak.</p><span class=\"price\">Mulai Rp 3,5 jt</span></div>\n<div class=\"card
    rv\"><div class=\"ico\">\U0001F6D2</div><h3>Toko Online</h3><p>Katalog produk,
    keranjang, checkout transfer &amp; e-wallet, ongkir otomatis, dan dashboard admin.</p><span
    class=\"price\">Mulai Rp 7 jt</span></div>\n<div class=\"card rv\"><div class=\"ico\">⚙️</div><h3>Aplikasi
    Kustom</h3><p>Sistem absensi, ticketing helpdesk, inventori, dan integrasi API
    sesuai alur bisnis Anda.</p><span class=\"price\">Survei dulu, gratis</span></div>\n<div
    class=\"card rv\"><div class=\"ico\">☁️</div><h3>Cloud &amp; Server</h3><p>Setup
    VPS, Kubernetes, backup otomatis, dan monitoring 24/7 agar sistem selalu online.</p><span
    class=\"price\">Mulai Rp 500 rb/bln</span></div>\n<div class=\"card rv\"><div
    class=\"ico\">\U0001F3A8</div><h3>Desain &amp; Branding</h3><p>Logo, company profile
    PDF, template sosmed, dan panduan brand yang konsisten.</p><span class=\"price\">Mulai
    Rp 1,5 jt</span></div>\n<div class=\"card rv\"><div class=\"ico\">\U0001F6E1️</div><h3>Maintenance</h3><p>Update
    keamanan, backup harian, dan teknisi siaga. Fokus ke bisnis, teknis biar kami.</p><span
    class=\"price\">Mulai Rp 300 rb/bln</span></div>\n</div></div></section>\n\n<section
    id=\"portfolio\" style=\"background:var(--bg2)\"><div class=\"wrap\">\n<h2 class=\"sec\">Portfolio
    Pilihan</h2><p class=\"sub\">Contoh hasil kerja terbaru kami</p>\n<div class=\"grid2\">\n<div
    class=\"pf rv\"><div class=\"thumb\" style=\"background:linear-gradient(135deg,#0ea5e9,#6366f1)\">APNM</div><div
    class=\"body\"><small>Web App</small><h3>Sistem Absensi APNM</h3><p style=\"color:var(--mut);font-size:.9rem\">Absensi
    QR + GPS, rekap otomatis, 800 karyawan aktif harian.</p></div></div>\n<div class=\"pf
    rv\"><div class=\"thumb\" style=\"background:linear-gradient(135deg,#10b981,#0ea5e9)\">BR</div><div
    class=\"body\"><small>E-Commerce</small><h3>Brait Store</h3><p style=\"color:var(--mut);font-size:.9rem\">Toko
    online fashion, 2.000+ order/bulan, integrasi 4 ekspedisi.</p></div></div>\n<div
    class=\"pf rv\"><div class=\"thumb\" style=\"background:linear-gradient(135deg,#f59e0b,#ef4444)\">HD</div><div
    class=\"body\"><small>Helpdesk</small><h3>IT Ticketing Corp</h3><p style=\"color:var(--mut);font-size:.9rem\">Tiket
    IT + notifikasi WhatsApp otomatis, SLA di atas 95%.</p></div></div>\n<div class=\"pf
    rv\"><div class=\"thumb\" style=\"background:linear-gradient(135deg,#8b5cf6,#ec4899)\">MG</div><div
    class=\"body\"><small>Company Profile</small><h3>Mega Griya Properti</h3><p style=\"color:var(--mut);font-size:.9rem\">Katalog
    unit + simulasi KPR, leads naik 3x dalam 6 bulan.</p></div></div>\n</div></div></section>\n\n<section
    id=\"testimoni\"><div class=\"wrap\">\n<h2 class=\"sec\">Kata Klien</h2><p class=\"sub\">Rating
    4.9/5 dari 80+ ulasan</p>\n<div class=\"testi\">\n<div class=\"t rv\"><div class=\"stars\">★★★★★</div><p>\"Website
    baru kami terlihat jauh lebih profesional. Inquiry masuk naik signifikan sejak
    launching.\"</p><b>Hendra Gunawan</b><small>Direktur, APNM</small></div>\n<div
    class=\"t rv\"><div class=\"stars\">★★★★★</div><p>\"Prosesnya rapi, ada staging
    untuk review, dan serah terima plus training admin. Recommended.\"</p><b>Sari
    Puspita</b><small>Owner, Brait Store</small></div>\n<div class=\"t rv\"><div class=\"stars\">★★★★★</div><p>\"Setelah
    pakai maintenance mereka, kami tidak pernah pusing soal update dan backup lagi.\"</p><b>Andi
    Pratama</b><small>IT Manager, Corp</small></div>\n</div></div></section>\n\n<section
    id=\"kontak\" style=\"background:var(--bg2)\"><div class=\"wrap\">\n<h2 class=\"sec\">Minta
    Penawaran</h2><p class=\"sub\">Respon &lt; 1x24 jam kerja • Konsultasi pertama
    gratis</p>\n<div class=\"contact\">\n<form onsubmit=\"return kirim(event)\">\n<label>Nama</label><input
    id=\"f-nama\" required placeholder=\"Nama Anda\">\n<label>Email / No. WA</label><input
    id=\"f-kontak\" required placeholder=\"08xx / email@...\">\n<label>Kebutuhan</label><select
    id=\"f-butuh\"><option>Company Profile</option><option>Toko Online</option><option>Aplikasi
    Kustom</option><option>Cloud & Server</option><option>Lainnya</option></select>\n<label>Ceritakan
    kebutuhan Anda</label><textarea id=\"f-msg\" rows=\"4\" required placeholder=\"Contoh:
    butuh website katalog 50 produk + WA order...\"></textarea>\n<br><br><button class=\"btn\"
    type=\"submit\" style=\"width:100%\">Kirim Permintaan</button>\n<p id=\"f-ok\"
    style=\"display:none;color:var(--ok);margin-top:10px\">✓ Terkirim! Tim kami akan
    menghubungi Anda. (demo: data tidak benar-benar dikirim)</p>\n</form>\n<div class=\"info\">\n<div>\U0001F4CD
    <b>Kantor:</b> Jl. Merdeka No. 100, Bandung</div>\n<div>\U0001F4DE <b>Tel/WA:</b>
    0812-3456-7890 (Senin–Jumat 09–17)</div>\n<div>✉️ <b>Email:</b> halo@nusatech.id</div>\n<div>\U0001F552
    <b>Operasional:</b> Tiket darurat 24/7 untuk klien maintenance</div>\n</div>\n</div></div></section>\n\n<footer>NusaTech
    © 2026 • Berjalan di atas Kubernetes (namespace: company) \U0001F680 • <b style=\"color:var(--ok)\">Promo
    Oktober: diskon 20% semua paket!</b></footer>\n<a class=\"wa\" href=\"https://wa.me/6281234567890\"
    aria-label=\"WhatsApp\">✆</a>\n\n<script>\n// angka statistik naik animasi\nfunction
    anim(el){const t=+el.dataset.n;let c=0;const s=Math.max(1,Math.round(t/60));const
    i=setInterval(()=>{c+=s;if(c>=t){c=t;clearInterval(i)}el.textContent=c+(t===99?'%':'+')},25)}\n//
    reveal saat scroll\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');e.target.querySelectorAll('[data-n]').forEach(anim);if(e.target.dataset.n)anim(e.target);io.unobserve(e.target)}}),{threshold:.15});\ndocument.querySelectorAll('.rv').forEach(el=>io.observe(el));\nfunction
    kirim(e){e.preventDefault();const n=document.getElementById('f-nama').value.trim(),k=document.getElementById('f-kontak').value.trim(),m=document.getElementById('f-msg').value.trim();if(!n||!k||!m){alert('Mohon
    lengkapi semua kolom.');return false}document.getElementById('f-ok').style.display='block';e.target.reset();return
    false}\n</script>\n</body>\n</html>\n"
kind: ConfigMap
metadata:
  name: company-site
  namespace: company
