# Mini-app 1: hit counter (state di Redis luar cluster)
apiVersion: v1
kind: Namespace
metadata:
  name: counter
---
apiVersion: v1
kind: Secret
metadata:
  name: counter
  namespace: counter
type: Opaque
stringData:
  REDIS_HOST: "192.168.0.103"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGEME-REDIS-PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter
  namespace: counter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: counter
  template:
    metadata:
      labels:
        app: counter
    spec:
      containers:
        - name: counter
          image: belajar/counter:v1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: counter
---
apiVersion: v1
kind: Service
metadata:
  name: counter
  namespace: counter
spec:
  selector:
    app: counter
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: counter
  namespace: counter
spec:
  ingressClassName: traefik
  rules:
    - host: counter.192.168.0.100.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: counter
                port:
                  number: 3000
