---
# apidb: Secret live berisi password ASLI, Git berisi placeholder.
# ignoreDifferences = ArgoCD tidak menyentuh Secret (drift yang disetujui).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apidb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dulkemot/belajar-k8s.git
    targetRevision: HEAD
    path: apps/apidb
  destination:
    server: https://kubernetes.default.svc
    namespace: apidb
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: apidb
      jsonPointers:
        - /data
