# Latihan 7 (lanjutan): onboarding semua aplikasi ke ArgoCD.
# Pola: satu Application per folder = satu tim bisa memiliki satu aplikasi.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dulkemot/belajar-k8s.git
    targetRevision: HEAD
    path: apps/uptime-kuma
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
