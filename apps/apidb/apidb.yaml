# Latihan 6: API yang memakai database LUAR cluster.
# Secret = amplop kredensial; Deployment hanya me-referensikannya via valueFrom.
apiVersion: v1
kind: Namespace
metadata:
  name: apidb
---
apiVersion: v1
kind: Secret
metadata:
  name: apidb
  namespace: apidb
type: Opaque
stringData:
  PGHOST: "192.168.0.103"
  PGPORT: "5432"
  PGUSER: "app"
  PGPASSWORD: "CHANGEME-PG-PASSWORD"
  PGDATABASE: "belajar"
  REDIS_HOST: "192.168.0.103"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGEME-REDIS-PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apidb
  namespace: apidb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apidb
  template:
    metadata:
      labels:
        app: apidb
    spec:
      containers:
        - name: api
          image: belajar/apidb:v1
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: apidb
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apidb
  namespace: apidb
spec:
  selector:
    app: apidb
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apidb
  namespace: apidb
spec:
  ingressClassName: traefik
  rules:
    - host: api.192.168.0.100.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apidb
                port:
                  number: 3000
    - host: api.brait.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apidb
                port:
                  number: 3000
